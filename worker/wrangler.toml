name = "macro-coach"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
APP_URL = "https://cam572.github.io/macro-tracker/"

# Created with: npx wrangler kv namespace create STORE  (id filled in on first setup)
[[kv_namespaces]]
binding = "STORE"
id = "e2297c3c069c45d4a16945a2c7d506c0"

# Keep the Whoop refresh token alive and collect Libre 3 readings
[triggers]
crons = ["*/15 * * * *"]

[observability]
enabled = true
